name: windows-exe
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-smoke-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install production dependencies
        run: python -m pip install -r requirements.txt
      - name: Build executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          cmd /c "build.bat" 2>&1 | Tee-Object reports/windows-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate packaged files
        shell: pwsh
        run: |
          $root = "dist\Planning"
          $problems = @()
          foreach ($name in @("Planning.exe", "PlanningUpdater.exe", "icon.ico", "version.txt")) {
            if (-not (Test-Path "$root\$name")) { $problems += "$name is missing" }
          }
          if (Get-ChildItem $root -Recurse -File -Include *.db,*.sqlite,*.sqlite3 -ErrorAction SilentlyContinue) { $problems += "database file is in package" }
          "Package root: $root" | Out-File reports/installer-validation.md
          Get-ChildItem $root -Recurse -File | Select-Object FullName,Length | Format-Table | Out-File reports/installer-validation.md -Append
          if ($problems) { $problems | ForEach-Object { Write-Host "::error::$_" }; $problems | Out-File reports/installer-validation-failures.txt; exit 1 }
          "PASS: executable and runtime package validation" | Out-File reports/installer-validation.md -Append
      - name: Start packaged program smoke test
        run: python ci/smoke_exe.py --exe dist\Planning\Planning.exe --data-root "$env:RUNNER_TEMP\planning-smoke" --timeout 150
      - name: Write Windows job summary
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $status = if ($env:JOB_STATUS -eq "failure") { "FAIL" } else { "PASS" }
          @("## windows-exe — **$status**", "OS: Windows", "Build status: see windows-build.log", "", "### Package validation", (Get-Content reports/installer-validation.md -ErrorAction SilentlyContinue)) | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload Windows build, validation, and smoke reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe-reports
          path: |
            reports/
            ${{ runner.temp }}/planning-smoke/**/*.log
          if-no-files-found: warn
          retention-days: 14
