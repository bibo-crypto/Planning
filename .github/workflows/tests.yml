name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest and write JUnit XML
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          python -m pytest -q -rfEs --tb=short --junitxml="reports/junit-py${{ matrix.python-version }}.xml" 2>&1 | tee "reports/pytest-py${{ matrix.python-version }}.log"
      - name: Build Markdown report and job summary
        if: always()
        shell: bash
        run: |
          python ci/write_pytest_report.py \
            --xml "reports/junit-py${{ matrix.python-version }}.xml" \
            --log "reports/pytest-py${{ matrix.python-version }}.log" \
            --out "reports/pytest-py${{ matrix.python-version }}.md"
          {
            echo "## tests / Python ${{ matrix.python-version }}"
            echo "Operating system: Windows"
            cat "reports/pytest-py${{ matrix.python-version }}.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-windows-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
