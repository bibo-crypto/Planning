name: tests

# Runs the whole pytest suite on Windows (the platform the application ships on)
# for every push and pull request.  It only reads the repository: it never builds
# or publishes anything.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run the test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      # The failed tests are also written to the run's summary page, so they can be read without
      # opening the raw log.
      - name: Show the result on the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '### pytest'
            echo '```'
            grep -E '^(FAILED|ERROR) |[0-9]+ (passed|failed|error)' pytest.log | tail -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
