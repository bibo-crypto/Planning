name: tests

# Runs the whole pytest suite on Windows (the platform the application ships on)
# for every push and pull request.  It only reads the repository: it never builds
# or publishes anything.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what CI has always used; 3.14 is the Python the application is developed and built with.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      # The runner's desktop is small (~1024 px wide) and Windows keeps a window inside the screen, so the
      # layout tests that compare a 1920 px with a 1100 px window cannot run.  Try to enlarge the desktop;
      # if the runner refuses, those tests skip with the reason (the job's log shows the size that was used).
      - name: Enlarge the runner desktop (best effort)
        shell: pwsh
        continue-on-error: true
        run: |
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop
            Write-Host "display resolution set to 1920x1080"
          } catch {
            Write-Host "::warning title=Display resolution::could not be changed ($_); screen-size dependent tests will skip"
          }
      - name: Show the desktop size the GUI tests will see
        if: always()
        run: python -c "import tkinter as tk; r = tk.Tk(); print('desktop', r.winfo_screenwidth(), 'x', r.winfo_screenheight())"
      - name: Run the test suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -rfEs --tb=short 2>&1 | tee pytest.log
      # The failed tests are also written to the run's summary page, so they can be read without
      # opening the raw log.
      - name: Show the result on the run summary
        if: always()
        shell: bash
        run: |
          {
            echo '### pytest'
            echo '```'
            grep -E '^(SKIPPED|FAILED|ERROR) |[0-9]+ (passed|failed|error)' pytest.log | tr -d '\r' | tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # The failed tests as annotations: they are shown on the run page for anyone, without opening the log.
      - name: Annotate the failed tests
        if: always()
        shell: bash
        # GitHub runs `bash -eo pipefail`.  grep exits 1 when it finds nothing, so on a GREEN run (no FAILED/ERROR
        # line) the `failed=$(grep ... | ...)` assignment returned 1 and killed this step -- and with it the job --
        # after pytest had passed.  `|| true` is on the whole pipeline: "nothing found" is a normal result for
        # a report step.  It does not hide test failures: the "Run the test suite" step above fails the job itself.
        run: |
          result=$(grep -E '[0-9]+ (passed|failed|error)' pytest.log | tail -1 | tr -d '\r' || true)
          echo "::notice title=pytest result::${result:-no pytest summary line found in pytest.log}"
          failed=$(grep -E '^(FAILED|ERROR) ' pytest.log | head -25 | tr -d '\r' | cut -c1-230 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
          if [ -n "$failed" ]; then echo "::error title=pytest failed tests (first 25)::${failed}"; fi
          skipped=$(grep -E '^SKIPPED ' pytest.log | head -25 | tr -d '\r' | cut -c1-230 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' || true)
          if [ -n "$skipped" ]; then echo "::notice title=pytest skipped tests::${skipped}"; fi
      # The whole log is kept so a failure can be read after the run page's own log has expired or been truncated.
      - name: Keep the pytest log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-log-py${{ matrix.python-version }}
          path: pytest.log
          if-no-files-found: ignore
